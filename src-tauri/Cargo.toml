[package]
name = "CodeForge"
version = "26.3.0"
description = "CodeForge 是一款轻量级、高性能的桌面代码执行器，专为开发者、学生和编程爱好者设计。"
authors = ["devlive-community"]
edition = "2024"

[lib]
name = "codeforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = { version = "0.4.41", features = ["serde"] }

[dependencies]
tauri = { version = "2.11", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.47.1"
uuid = { version = "1.17.0", features = ["v4"] }
tempfile = "3.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
fern = "0.7.1"
dirs = "6.0.0"
regex = "1.11.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
rfd = "0.15"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
async-trait = "0.1"
mysql = { version = "25", default-features = false, features = ["minimal", "rustls-tls"] }
postgres = "0.19"
ureq = { version = "2", features = ["tls"] }
# 固定 mysql_common 的构建依赖 subprocess 到不依赖 let 链的旧版，兼容当前 Rust 工具链
subprocess = "=0.2.9"
portable-pty = "0.8"
zip = "2.2.2"
flate2 = "1.0"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
notify = "6"
native-tls = "0.2.18"
postgres-native-tls = "0.5"

# DuckDB 走 bundled 编译，其 vendored C++(fmt) 在部分新版 MSVC 上编译失败，
# 故仅在非 Windows 平台启用；Windows 不提供 DuckDB 数据源。
[target.'cfg(not(target_os = "windows"))'.dependencies]
duckdb = { version = "1", features = ["bundled"] }
