    <rect x="64" y="58" width="32" height="5" rx="2.5" fill="#68d391" opacity="0.5" />
    <rect x="64" y="74" width="38" height="5" rx="2.5" fill="#68d391" opacity="0.6" />
    <rect x="64" y="90" width="22" height="5" rx="2.5" fill="#68d391" opacity="0.4" />
